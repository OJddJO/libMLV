name: Release new version
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release'
        required: true

permissions:
  contents: write

jobs:
  create_release:
    name: Create Release and upload assets
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.version || github.ref_name }}

    steps:
      - name: Checkout repository (full history)
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Create changelog from commits since latest tag
        id: make_changelog
        run: |
          set -euo pipefail
          CHANGELOG="$(printf 'MLV ${VERSION}\n\n')"
        shell: bash

      - name: Create GitHub Release (API)
        id: create_release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          VERSION: ${{ env.VERSION }}
          CHANGELOG: ${{ steps.make_changelog.outputs.changelog }}
        run: |
          set -euo pipefail
          API="https://api.github.com/repos/${GITHUB_REPOSITORY}/releases"
          JSON=$(jq -n --arg tag "${VERSION}" --arg name "${VERSION}" --arg body "${CHANGELOG}" \
            '{ tag_name: $tag, name: $name, body: $body, draft: false, prerelease: false }')
          curl -sSL -H "Authorization: token ${GITHUB_TOKEN}" -H "Accept: application/vnd.github+json" \
            -d "$JSON" "$API"
        shell: bash

  build-ubuntu:
    name: Build and Package for Ubuntu
    needs: create_release
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.version || github.ref_name }}

    steps:
      - uses: actions/checkout@v3

      - name: Set up build tools
        run: |
          sudo apt-get update
          sudo apt-get install --fix-missing build-essential libsdl2-dev libsdl2-image-dev libsdl2-ttf-dev libsdl2-mixer-dev libsdl2-gfx-dev libglib2.0-dev libxml2-dev -yq

      - name: Build
        run: make
        shell: bash

      - name: Package assets
        run: |
          set -e
          mkdir -p release tmp_release tmp_release/include/
          rm -rf tmp_release/* _linux/build/
          cp -R _linux/. tmp_release/
          cp -R README.md README COPYING AUTHORS gpl.txt tmp_release/
          cp -R include/MLV tmp_release/include/
          tar -czf "release/MLV-${VERSION}-linux.tar.gz" -C tmp_release .
          rm -rf tmp_release
        shell: bash

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: ./release/MLV-${{ env.VERSION }}-linux.tar.gz
          tag_name: ${{ env.VERSION }}

