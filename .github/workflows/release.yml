name: Release new version
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release'
        required: true
      pre-release:
        description: 'Is this a pre-release?'
        required: true
        type: boolean

permissions:
  contents: write

jobs:
  create_release:
    name: Create Release
    runs-on: ubuntu-22.04
    env:
      VERSION: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.version }}
      PRE_RELEASE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.pre-release }}

    steps:
      - name: Checkout repository (full history)
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Create GitHub Release (API)
        id: create_release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          VERSION: ${{ env.VERSION }}
          PRE_RELEASE: ${{ env.PRE_RELEASE }}
        run: |
          set -euo pipefail
          API="https://api.github.com/repos/${GITHUB_REPOSITORY}/releases"
          JSON=$(jq -n --arg tag "${VERSION}" --arg name "${VERSION}" --arg pre_release "${PRE_RELEASE}"\
            '{ tag_name: $tag, name: $name, draft: false, prerelease: ($pre_release == "true"), make_latest: ($pre_release == "false"), generate_release_notes: true }')
          curl -sSL -H "Authorization: token ${GITHUB_TOKEN}" -H "Accept: application/vnd.github+json" \
            -d "$JSON" "$API"
        shell: bash

  build-ubuntu:
    name: Build and Package for Ubuntu
    needs: create_release
    runs-on: ubuntu-22.04
    env:
      VERSION: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.version || github.ref_name }}

    steps:
      - uses: actions/checkout@v3

      - name: Set up build tools
        run: |
          sudo apt-get update
          sudo apt-get install --fix-missing build-essential libsdl1.2-compat-dev libsdl-image1.2-dev libsdl-ttf2.0-dev libsdl-mixer1.2-dev libsdl-gfx1.2-dev libxml2-dev -yq

      - name: Build
        run: make
        shell: bash

      - name: Package assets
        run: |
          set -e
          mkdir -p release tmp_release tmp_release/include
          rm -rf tmp_release/* _linux/build/
          cp -R _linux/ tmp_release/
          cp -R README.md AUTHORS COPYING gpl.txt tmp_release/
          cp -R include/MLV tmp_release/include/
          cp -R data tmp_release/bin/
          tar -czf "release/MLV-${VERSION}-linux.tar.gz" -C tmp_release .
          rm -rf tmp_release
        shell: bash

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: ./release/MLV-${{ env.VERSION }}-linux.tar.gz
          tag_name: ${{ env.VERSION }}

  build-windows:
    name: Build and Package for Windows
    needs: create_release
    runs-on: windows-latest
    env:
      VERSION: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.version || github.ref_name }}

    steps:
      - uses: actions/checkout@v3

      - name: Set up build tools
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >
            mingw-w64-x86_64-toolchain
            make
            mingw-w64-x86_64-libxml2
            mingw-w64-x86_64-sdl12-compat
            mingw-w64-x86_64-SDL_gfx
            mingw-w64-x86_64-SDL_ttf
            mingw-w64-x86_64-SDL_image
            mingw-w64-x86_64-SDL_mixer
            mingw-w64-x86_64-7zip

      - name: Build
        run: make
        shell: msys2 {0}

      - name: Package assets
        run: |
          mkdir -p release tmp_release tmp_release/include
          rm -rf tmp_release/* _windows/build/
          cp -R _windows/ tmp_release/
          cp -R README.md AUTHORS COPYING gpl.txt tmp_release/
          cp -R include/MLV tmp_release/include/
          cp -R data tmp_release/bin/
          (cd _windows && 7z a -tzip "../release/MLV-${VERSION}-windows.zip" ./*)
          7z a -tzip "release/MLV-${VERSION}-windows.zip" include README.md AUTHORS COPYING gpl.txt
        shell: msys2 {0}

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: ./release/MLV-${{ env.VERSION }}-windows.zip
          tag_name: ${{ env.VERSION }}
